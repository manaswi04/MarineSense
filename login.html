<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MarineSense Login</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-950 flex items-center justify-center min-h-screen">

<div class="w-full max-w-md px-4">

<div class="bg-slate-900 p-8 rounded-3xl border border-cyan-900/30 shadow-xl">

<h1 class="text-4xl font-bold text-cyan-400 mb-2">
MarineSense
</h1>

<p class="text-gray-400 mb-6">
Ocean Intelligence Platform
</p>

<!-- Username -->
<input
id="username"
type="text"
placeholder="Username"
autocomplete="username"
class="w-full p-3 rounded-xl bg-slate-800 text-white mb-4 outline-none focus:ring-2 focus:ring-cyan-500"
/>

<!-- Password -->
<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
class="w-full p-3 rounded-xl bg-slate-800 text-white mb-6 outline-none focus:ring-2 focus:ring-cyan-500"
/>

<!-- Login Button -->
<button
onclick="login()"
class="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold hover:bg-cyan-400 transition"
>
Login
</button>

<!-- Error Message -->
<p
id="error"
class="text-red-400 mt-4 text-sm text-center"
></p>

<!-- Signup -->
<p class="text-gray-400 text-sm text-center mt-6">

Don't have an account?

<a
href="signup.html"
class="text-cyan-400 font-semibold hover:text-cyan-300"
>
Create Account
</a>

</p>

</div>

</div>

<script src="login.js"></script>

</body>

</html>
