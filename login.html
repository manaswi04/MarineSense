<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MarineSense Login</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-950 flex items-center justify-center min-h-screen">

<div class="w-full max-w-md">

<div class="bg-slate-900 p-8 rounded-3xl border border-cyan-900/30">

<h1 class="text-4xl font-bold text-cyan-400 mb-2">
MarineSense
</h1>

<p class="text-gray-400 mb-6">
Ocean Intelligence Platform
</p>

<input
id="email"
type="email"
placeholder="Email"
class="w-full p-3 rounded-xl bg-slate-800 text-white mb-4"
/>

<input
id="password"
type="password"
placeholder="Password"
class="w-full p-3 rounded-xl bg-slate-800 text-white mb-6"
/>

<button
onclick="login()"
class="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold"
>
Login
</button>

<p
id="error"
class="text-red-400 mt-4 text-sm"
></p>

</div>

</div>

<script src="login.js"></script>

</body>

</html>
